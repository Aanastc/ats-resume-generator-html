name: Atualização Diária de Vagas (08:00 BRT)

on:
  schedule:
    # 11:00 UTC = 08:00 Horário de Brasília (BRT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar Dados Atualizados do Portfólio (GitHub)
        run: node scripts/sync-portfolio.mjs

      - name: Coletar e Validar Vagas Ativas (Saúde, EdTech, BH e Remoto)
        run: node scripts/fetch-jobs.mjs

      - name: Re-renderizar HTML do Currículo
        run: node scripts/render.mjs

      - name: Commitar e Publicar Atualizações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs-cache.json data/resume.json data/resume-pt.json dist/cv.html
          git diff --staged --quiet || (git commit -m "chore(sync): sincronização diária de vagas e portfólio [08:00 BRT]" && git push)

